<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dividir PDF em paginas</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
            --success-bg: #dcfce7;
            --success-text: #166534;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: var(--card);
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
        }

        p.subtitulo {
            margin: 0 0 24px 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px dashed var(--border);
            border-radius: 8px;
            background: #fafafa;
            cursor: pointer;
        }

        .checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f9fafb;
        }

        .checkbox input {
            margin-top: 3px;
        }

        .checkbox .descricao {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 2px;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover { background: var(--primary-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .alerta {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .alerta.erro {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .alerta.sucesso {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .rodape {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Dividir PDF em paginas</h1>
        <p class="subtitulo">
            Envie um arquivo PDF e receba um .zip com uma pagina por arquivo.
        </p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, msg in mensagens %}
                <div class="alerta {{ categoria }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('dividir') }}" method="post" enctype="multipart/form-data" id="form-pdf">
            <div class="campo">
                <label for="arquivo">Arquivo PDF</label>
                <input id="arquivo" type="file" name="arquivo" accept="application/pdf,.pdf" required>
            </div>

            <div class="campo">
                <label class="checkbox" for="ignorar_duplicados">
                    <input id="ignorar_duplicados" type="checkbox" name="ignorar_duplicados">
                    <span>
                        Ignorar paginas duplicadas
                        <div class="descricao">
                            Paginas com conteudo identico a alguma anterior serao puladas.
                        </div>
                    </span>
                </label>
            </div>

            <button type="submit" id="botao">Dividir e baixar ZIP</button>
        </form>

        <p class="rodape">Limite de upload: {{ tamanho_maximo_mb }} MB</p>
    </main>

    <script>
        const form = document.getElementById("form-pdf");
        const botao = document.getElementById("botao");
        form.addEventListener("submit", () => {
            botao.disabled = true;
            botao.textContent = "Processando...";
            // reabilita apos alguns segundos caso o download falhe e o usuario fique preso
            setTimeout(() => {
                botao.disabled = false;
                botao.textContent = "Dividir e baixar ZIP";
            }, 10000);
        });
    </script>
</body>
</html>
